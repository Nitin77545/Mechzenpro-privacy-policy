<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .password-box {
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px 40px 12px 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
    }

    .eye {
      position: absolute;
      right: 12px;
      top: 12px;
      cursor: pointer;
      color: #666;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #5a67d8;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      color: green;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Reset Your Password</h2>

  <form onsubmit="event.preventDefault(); resetPassword();">

    <div class="password-box">
      <input type="password" id="newPassword" placeholder="New Password" required>
      <i class="fa-solid fa-eye eye" onclick="toggle('newPassword', this)"></i>
    </div>

    <div class="password-box">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <i class="fa-solid fa-eye eye" onclick="toggle('confirmPassword', this)"></i>
    </div>

    <button type="submit">Reset Password</button>

  </form>

  <p id="message"></p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const uid = params.get("uid");
  const token = params.get("token");

  function toggle(id, icon) {
    const input = document.getElementById(id);

    if (input.type === "password") {
      input.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.replace("fa-eye-slash", "fa-eye");
    }
  }

  function resetPassword() {
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    // ✅ Password match validation
    if (newPassword !== confirmPassword) {
      message.style.color = "red";
      message.innerText = "Passwords do not match!";
      return; // stop API call
    }

    fetch("https://api.mechzenpro.in/userapi/reset-password/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        uid: uid,
        token: token,
        new_password: newPassword,
        confirm_password: confirmPassword
      })
    })
    .then(res => res.json())
    .then(data => {
      message.style.color = "green";
      message.innerText = data.message;
    })
    .catch(() => {
      message.style.color = "red";
      message.innerText = "Something went wrong";
    });
  }
</script>

</body>
</html>
